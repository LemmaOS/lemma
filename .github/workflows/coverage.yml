name: Coverage

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg18
        env:
          POSTGRES_DB: lemma-db
          POSTGRES_USER: lemma
          POSTGRES_PASSWORD: lemma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U lemma -d lemma-db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Without a reachable S3 backend the s3 smoke tests skip after their
      # 2s probe, leaving s3.rs uncovered here while it is covered locally.
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: lemma
          RUSTFS_SECRET_KEY: lemma-secret
          RUSTFS_ADDRESS: ":9000"
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://lemma:lemma@127.0.0.1:5432/lemma-db
    steps:
      - uses: actions/checkout@v7

      # The smoke tests expect the lemma bucket to pre-exist; same role as
      # the rustfs-init one-shot container in docker-compose.
      - name: Create archive bucket
        run: >
          docker run --rm --network host
          -e AWS_ACCESS_KEY_ID=lemma -e AWS_SECRET_ACCESS_KEY=lemma-secret
          -e AWS_REGION=us-east-1
          amazon/aws-cli s3api create-bucket --bucket lemma
          --endpoint-url http://127.0.0.1:9000

      # lemma-server is process wiring with no tests; excluding it keeps
      # the gate meaningful and drops the web/dist embed dependency.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.0"

      - name: Install nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Coverage
        # NEXTEST_PROFILE selects the ci profile, which also writes JUnit
        # XML for the test-results upload below.
        run: >
          cargo llvm-cov nextest --workspace --exclude lemma-server
          --lcov --output-path lcov.info
          --fail-under-lines 85
        env:
          NEXTEST_PROFILE: ci

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          flags: rust
          report_type: test_results

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 生成物不入 git，先重新生成
      - name: Generate proto code
        run: npm run gen:proto

      - name: Coverage
        # The junit reporter emits web/junit.xml for the test-results
        # upload below; the default reporter keeps the console log.
        run: >
          npm run test:cov -w web --
          --reporter=default --reporter=junit
          --outputFile.junit=junit.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/junit.xml
          flags: web
          report_type: test_results

      # Bundle analysis uploads inside `vite build`; without the token env
      # the plugin stays a no-op.
      - name: Build with bundle analysis
        run: npm run build -w web
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
