name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "proto/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "proto/**"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # lemma-server 用 RustEmbed 内嵌 web/dist（gitignore 的构建产物），
  # 先构建真实前端产物，clippy/test 经 artifact 取回
  web-dist:
    name: Web dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup buf
        uses: bufbuild/buf-action@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate proto code
        run: npm run gen:proto

      - name: Build web
        run: npm run build -w web

      - name: Upload web/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: web-dist
    steps:
      - uses: actions/checkout@v5

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.0"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg18
        env:
          POSTGRES_DB: lemma-db
          POSTGRES_USER: lemma
          POSTGRES_PASSWORD: lemma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U lemma -d lemma-db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://lemma:lemma@127.0.0.1:5432/lemma-db
    needs: web-dist
    steps:
      - uses: actions/checkout@v5

      - name: Download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.0"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace

  check:
    name: check
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
    if: ${{ always() }}
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "Rust CI failed"
            exit 1
          fi
