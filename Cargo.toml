[workspace]
resolver = "2"
members = [
    "crates/lemma-server",
    "crates/lemma-db",
    "crates/lemma-proto",
    "crates/lemma-auth",
    "crates/lemma-providers",
    "crates/lemma-conversations",
    "crates/lemma-chat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 本地依赖
lemma-db = { path = "crates/lemma-db" }
lemma-proto = { path = "crates/lemma-proto" }
lemma-auth = { path = "crates/lemma-auth" }
lemma-providers = { path = "crates/lemma-providers" }
lemma-conversations = { path = "crates/lemma-conversations" }
lemma-chat = { path = "crates/lemma-chat" }
# 远程依赖
axum = "0.8.9"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json", "chrono"] }
connectrpc = { version = "0.8.1", features = ["server", "axum"] }
connectrpc-build = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.5.3"
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
rand = "0.10.2"
sha2 = "0.11.0"
aes-gcm = "0.11.0"
base64 = "0.23.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
http = "1.5.0"
dashmap = "6.2.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[workspace.lints.rust]
linker_messages = "allow"
