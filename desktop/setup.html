<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Connect to your Lemma server</title>
    </head>
    <body>
        <main class="card" id="connect-view">
            <h1>Lemma</h1>
            <p class="desc">
                Enter the address of your self-hosted Lemma server.
            </p>
            <p id="reason" class="reason" hidden></p>
            <form id="form">
                <input
                    id="url"
                    type="text"
                    placeholder="http://127.0.0.1:1025"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button type="submit" id="connect">Connect</button>
            </form>
        </main>
        <main class="card" id="done-view" hidden>
            <h1>Connected</h1>
            <p class="desc">
                Lemma will sync your conversations and settings with this
                server.
            </p>
            <p class="server-url" id="connected-url"></p>
            <div class="actions">
                <button type="button" id="change" class="secondary">
                    Change server
                </button>
                <button type="button" id="done">Done</button>
            </div>
        </main>
        <script type="module" src="/src/setup.ts"></script>
    </body>
</html>
