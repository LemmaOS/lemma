syntax = "proto3";

package lemma.v1;

// 业务错误码（闭集）：可预期、面向用户的错误，随 ErrorInfo 附在 ConnectError.details。
// 运维错误（db / 密封 / 上游）不进此枚举，保持 internal + 英文原文，永不本地化。
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // 认证
  ERROR_REASON_CREDENTIALS_INVALID = 1; // 用户名或密码错误
  ERROR_REASON_USERNAME_TAKEN = 2; // 用户名或邮箱已被占用
  ERROR_REASON_SIGNUP_FIELDS_REQUIRED = 3; // 注册字段缺失或密码过短
  ERROR_REASON_LOGIN_TARGET_REQUIRED = 4; // 登录须且仅须 username / email 之一
  ERROR_REASON_TOKEN_INVALID = 5; // 令牌缺失 / 无效 / 过期 / 重放
  ERROR_REASON_USER_NOT_FOUND = 6;

  // Provider
  ERROR_REASON_PROVIDER_FIELDS_REQUIRED = 10; // name / base_url / api_key 必填
  ERROR_REASON_PROVIDER_KIND_INVALID = 11;
  ERROR_REASON_PROVIDER_NOT_FOUND = 12;
  ERROR_REASON_PROVIDER_DISABLED = 13;

  // 会话与消息
  ERROR_REASON_ID_INVALID = 20; // UUID 解析失败（各域共享）
  ERROR_REASON_TITLE_REQUIRED = 21;
  ERROR_REASON_CONVERSATION_NOT_FOUND = 22;
  ERROR_REASON_CONVERSATION_NOT_ACTIVE = 23; // 不存在或已归档
  ERROR_REASON_CONVERSATION_NOT_ARCHIVED = 24; // 不存在或未归档
  ERROR_REASON_ARCHIVED_CONVERSATION_NOT_FOUND = 25;
  ERROR_REASON_MESSAGE_NOT_FOUND = 26;
  ERROR_REASON_NOT_ASSISTANT_MESSAGE = 27; // 仅 assistant 消息可续传 / 中止
  ERROR_REASON_CONTENT_REQUIRED = 28;
  ERROR_REASON_MODEL_REQUIRED = 29;

  // 归档存储
  ERROR_REASON_STORAGE_ENDPOINT_REQUIRED = 30;
  ERROR_REASON_STORAGE_BUCKET_REQUIRED = 31;
  ERROR_REASON_STORAGE_ACCESS_KEY_REQUIRED = 32;
  ERROR_REASON_STORAGE_SECRET_KEY_REQUIRED = 33;
  ERROR_REASON_STORAGE_NOT_CONFIGURED = 34;
  ERROR_REASON_MIGRATION_NOT_PENDING = 35; // 无待迁移快照
  ERROR_REASON_STORAGE_HAS_ARCHIVES = 36; // 仍有归档引用，删除被阻止
  ERROR_REASON_BUCKET_NOT_FOUND = 37; // attrs 携带 bucket
}

// 附在 ConnectError.details 的结构化错误；文案由前端 i18n 按 reason 渲染
message ErrorInfo {
  ErrorReason reason = 1;
  // i18n 插值参数（如 bucket not found 的桶名）
  map<string, string> attrs = 2;
}
