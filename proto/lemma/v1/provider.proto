syntax = "proto3";

package lemma.v1;

import "google/protobuf/timestamp.proto";

// 供应商协议类型
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_OPENAI = 1; // OpenAI Compatible
  PROVIDER_KIND_ANTHROPIC = 2; // Anthropic Messages API
  PROVIDER_KIND_GEMINI = 3; // Gemini Content Generation API
}

// 供应商配置（每用户独立，互不可见）
message Provider {
  string id = 1;
  ProviderKind kind = 2;
  string name = 3;
  string base_url = 4; // 含版本段，如 https://api.openai.com/v1
  string api_key = 5; // 返回时脱敏
  repeated string models = 6;
  bool enabled = 7;
  string api_path = 8; // 留空按 kind 默认
  string models_path = 9; // 留空为 /models
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// 区分"未提供"与"清空"
message ProviderModelsPatch {
  repeated string models = 1;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

message CreateProviderRequest {
  ProviderKind kind = 1;
  string name = 2;
  string base_url = 3;
  string api_key = 4;
  repeated string models = 5;
  string api_path = 6;
  string models_path = 7;
}

message UpdateProviderRequest {
  string id = 1;
  // 未设置的字段不变更
  optional string name = 2;
  optional string base_url = 3;
  optional string api_key = 4;
  optional bool enabled = 5;
  optional ProviderModelsPatch models = 6;
  optional string api_path = 7;
  optional string models_path = 8;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message FetchModelsRequest {
  // id 与 (kind/base_url/api_key) 二选一
  string id = 1;
  ProviderKind kind = 2;
  string base_url = 3;
  string api_key = 4;
  string models_path = 5;
}

message FetchModelsResponse {
  repeated string models = 1;
}

message CreateProviderResponse {
  Provider provider = 1;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

service ProviderService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // 拉取供应商远程模型列表
  rpc FetchModels(FetchModelsRequest) returns (FetchModelsResponse);
}
